[pytest]
testpaths = tests
pythonpath = .
# loadfile: all tests of one file run on one xdist worker. Needed because of issue D
# (concurrent room creates return another client's room): every test that creates rooms
# must live in tests/api/test_rooms.py. Remove --dist loadfile once D is fixed.
# (xdist_group would be cleaner but has no effect on pytest 9.2.0 + pytest-xdist 3.8.0.)
addopts = -ra --strict-markers --dist loadfile -m "not race"
markers =
    api: API layer test
    ui: UI end-to-end test
    smoke: fast critical checks
    regression: full regression suite
    race: concurrency probe for a known RBP race (issue D); excluded by default, run with -m race
    service: talks directly to RBP service ports (not exposed on the backup environment)
    issue(number): link to a GitHub issue or story
